syntax = "proto3";

package api.v1;

option csharp_namespace = "Yuujins.Api.V1";

// Card represents one playing card. Rank 1-13 (A=1, 2-10, J=11, Q=12, K=13).
// Suit 0-3 (e.g. Clubs, Diamonds, Hearts, Spades). Baccarat point: 1-9 = rank, 10/J/Q/K = 0.
message Card {
  int32 rank = 1;  // 1-13
  int32 suit = 2;  // 0-3
}
