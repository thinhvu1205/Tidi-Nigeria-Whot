syntax = "proto3";

package economy.wallet.v1;

message Wallet {
  string user_id = 1;
  int64 chips = 2;
  int64 bank_chips = 3;

  message Request {
    message DepositBank {
      int64 amount = 1;
    }

    message WithdrawBank {
      int64 amount = 1;
    }

    message SendChips {
      int64 recipient_cid = 1;
      int64 amount = 2;
    }
  }
}
